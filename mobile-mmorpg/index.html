<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <title>YDH Chronicle MMORPG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="game-shell">
    <canvas id="world" aria-label="YDH MMORPG world"></canvas>

    <section class="hud top-left">
      <div class="avatar"><span id="classMark">K</span></div>
      <div class="bars">
        <strong id="charName">검은 기사</strong>
        <div class="bar hp"><i id="hpBar"></i><b id="hpText">120/120</b></div>
        <div class="bar mp"><i id="mpBar"></i><b id="mpText">60/60</b></div>
        <div class="bar xp"><i id="xpBar"></i><b id="xpText">0%</b></div>
      </div>
    </section>

    <section class="hud top-right">
      <canvas id="minimap" width="132" height="132" aria-label="미니맵"></canvas>
      <div class="zone" id="zoneName">말하는 섬 전초기지</div>
    </section>

    <section class="hud bottom-left">
      <div class="joystick" id="joy"><i id="stick"></i></div>
      <div class="chat" id="chatLog"></div>
    </section>

    <section class="hud bottom-right">
      <button class="skill primary" id="attackBtn">공격</button>
      <button class="skill" data-skill="powerSlash">십자</button>
      <button class="skill" data-skill="fireBurst">화염</button>
      <button class="skill" data-skill="healLight">회복</button>
      <button class="skill" data-skill="guardAura">수호</button>
      <button class="skill menu" id="menuBtn">메뉴</button>
    </section>

    <section class="panel quest-panel" id="questPanel">
      <b>퀘스트</b>
      <span id="questText">늑대 3마리 처치 0/3</span>
    </section>

    <section class="modal hidden" id="menuModal">
      <div class="modal-card">
        <button class="close" id="closeMenu">닫기</button>
        <h2>YDH Chronicle MMORPG</h2>
        <p>모바일 전용 Canvas MMORPG 클라이언트입니다. 필드 이동, 몬스터 사냥, NPC 상호작용, 퀘스트, 인벤토리 저장을 지원합니다.</p>
        <div class="menu-grid">
          <button data-class="knight">기사</button>
          <button data-class="wizard">마법사</button>
          <button data-class="ranger">요정</button>
          <button data-class="rogue">로그</button>
        </div>
        <h3>인벤토리</h3>
        <ul id="inventoryList"></ul>
        <button class="danger" id="resetBtn">저장 초기화</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
