<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#101827" />
<title>YDH Chronicle RunNow</title>
<style>
:root{--bg:#070b12;--panel:#101827;--line:#26344c;--gold:#f7c85f;--blue:#73a7ff;--red:#ff6b6b;--green:#69dda0;--muted:#aab5c7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,#1f315c,transparent 34rem),var(--bg);color:#eef4ff;touch-action:manipulation}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border:1px solid var(--line);border-radius:22px;background:rgba(16,24,39,.9)}.brand{display:flex;align-items:center;gap:10px}.crest{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#ff835f,var(--blue));display:grid;place-items:center;color:#101827;font-weight:1000}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:var(--muted)}.btn{border:1px solid var(--line);background:#172338;color:#eef4ff;border-radius:999px;padding:10px 14px;font-weight:800}.btn.primary{background:linear-gradient(135deg,var(--gold),#ff835f);color:#160e04;border:0}.grid{display:grid;grid-template-columns:300px 1fr 320px;gap:14px;margin-top:14px}.panel{border:1px solid var(--line);border-radius:22px;background:rgba(16,24,39,.86);padding:14px;box-shadow:0 16px 45px rgba(0,0,0,.25)}h2,h3{margin:0 0 10px}.hero{display:grid;place-items:center;height:210px;border-radius:18px;background:linear-gradient(180deg,#17243b,#0b101a);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:2px solid rgba(247,200,95,.2);animation:spin 16s linear infinite}.player{font-size:70px;z-index:1;animation:bob 1.8s ease-in-out infinite}.bar{height:12px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:100%}.bar.mp i{background:linear-gradient(90deg,var(--blue),#ad82ff)}.bar.xp i{background:linear-gradient(90deg,var(--green),var(--gold)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats span,.inv li{padding:9px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04)}ul{padding:0;margin:0;list-style:none;display:grid;gap:8px}.battle{min-height:310px;display:grid;place-items:center;position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#1c2942,#0d141f)}.mob{font-size:68px;animation:bob 1.5s ease-in-out infinite reverse}.impact{position:absolute;font-size:54px;opacity:0;transform:scale(.4)}.impact.on{animation:hit .45s ease}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.skill{min-height:78px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.05);color:#eef4ff;padding:8px;font-weight:800}.skill b{display:block;font-size:24px}.log{height:290px;overflow:auto;display:flex;flex-direction:column-reverse;gap:6px}.log p{margin:0;padding:8px;border-radius:10px;background:rgba(255,255,255,.05);color:var(--muted);font-size:13px}.map{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:10px}.tile{aspect-ratio:1;border-radius:7px;background:#27472f;display:grid;place-items:center;font-size:16px;border:1px solid rgba(255,255,255,.08)}.water{background:#17345b}.road{background:#6a5133}.wall{background:#333944}.portal{background:#3b236a}.me{outline:2px solid var(--gold);box-shadow:0 0 18px rgba(247,200,95,.55)}.dpad{display:grid;grid-template-columns:60px 60px 60px;gap:8px;justify-content:center;margin-top:12px}.dpad button{height:54px;border-radius:16px;border:1px solid var(--line);background:#172338;color:#eef4ff;font-size:22px;font-weight:900}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.gallery img{width:100%;border-radius:16px;border:1px solid var(--line);background:#101827}.gallery small{display:block;color:var(--muted);text-align:center;margin-top:4px}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes hit{0%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.8)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.skills{grid-template-columns:1fr 1fr}.app{padding:10px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><div class="crest">Y</div><div><h1>YDH Chronicle Mobile</h1><small>바로 실행용 모바일 웹게임</small></div></div><button class="btn primary" onclick="resetGame()">초기화</button></header><section class="grid"><aside class="panel"><h2>검은 기사</h2><div class="hero"><div class="player">방패</div></div><p>HP <b id="hpText"></b></p><div class="bar"><i id="hpBar"></i></div><p>MP <b id="mpText"></b></p><div class="bar mp"><i id="mpBar"></i></div><p>EXP <b id="xpText"></b></p><div class="bar xp"><i id="xpBar"></i></div><div class="stats"><span>Lv <b id="lv"></b></span><span>Gold <b id="gold"></b></span><span>ATK <b id="atk"></b></span><span>DEF <b id="def"></b></span></div><h3 style="margin-top:14px">인벤토리</h3><ul class="inv" id="inv"></ul></aside><main class="panel"><h2>말하는 섬 해안</h2><div class="battle"><div class="mob" id="mob">늑대</div><div class="impact" id="impact">공격</div></div><p><b id="mobName"></b> HP <b id="mobHpText"></b></p><div class="bar"><i id="mobHpBar"></i></div><div class="skills"><button class="skill" onclick="attack('slash')"><b>검</b>십자 베기</button><button class="skill" onclick="attack('fire')"><b>불</b>혈염 폭발</button><button class="skill" onclick="heal()"><b>빛</b>성역의 빛</button><button class="skill" onclick="attack('ice')"><b>얼음</b>냉기 덫</button><button class="skill" onclick="guard()"><b>방패</b>황금 수호</button><button class="skill" onclick="nextMob()"><b>몹</b>다음 몬스터</button></div><h3 style="margin-top:16px">월드맵</h3><div class="map" id="map"></div><div class="dpad"><span></span><button onclick="move(0,-1)">▲</button><span></span><button onclick="move(-1,0)">◀</button><button onclick="move(0,0)">◎</button><button onclick="move(1,0)">▶</button><span></span><button onclick="move(0,1)">▼</button><span></span></div></main><aside class="panel"><h2>실시간 로그</h2><div class="log" id="log"></div><h3 style="margin-top:14px">에셋 갤러리</h3><div class="gallery"><div><img src="assets/classes-showcase.svg"><small>클래스</small></div><div><img src="assets/npc-showcase.svg"><small>NPC</small></div><div><img src="assets/monster-showcase.svg"><small>몬스터</small></div><div><img src="assets/environment-showcase.svg"><small>타일</small></div></div></aside></section></div>
<script>
const mobs=[["그림자 늑대","늑대",75,11],["해골 전사","해골",90,13],["오크 광전사","오크",135,19],["언데드 마법사","마법사",110,21],["늪지 도마뱀","도마뱀",100,15]];const mapRows=["TTTTTTTTT","TGGGRGGGT","TGRRRGWGT","TGGPGGWGT","TGGGRRGGT","TWWGGGRGT","TGGGTRGGT","TGGGRGGGT","TTTTTTTTT"];let s=JSON.parse(localStorage.ydh_run_now||"null")||{lv:1,hp:120,mp:60,xp:0,gold:0,atk:16,def:6,inv:["회복 물약","푸른 단검"],m:0,mhp:75,x:3,y:3};function save(){localStorage.ydh_run_now=JSON.stringify(s)}function log(t){const p=document.createElement("p");p.textContent=new Date().toLocaleTimeString()+" · "+t;document.getElementById("log").appendChild(p)}function render(){let m=mobs[s.m];lv.textContent=s.lv;hpText.textContent=s.hp+"/120";mpText.textContent=s.mp+"/80";xpText.textContent=s.xp+"/100";gold.textContent=s.gold;atk.textContent=s.atk;def.textContent=s.def;hpBar.style.width=Math.max(0,s.hp/120*100)+"%";mpBar.style.width=Math.max(0,s.mp/80*100)+"%";xpBar.style.width=Math.max(0,s.xp)+"%";mob.textContent=m[1];mobName.textContent=m[0];mobHpText.textContent=s.mhp+"/"+m[2];mobHpBar.style.width=Math.max(0,s.mhp/m[2]*100)+"%";inv.innerHTML=s.inv.map(x=>"<li>가방 "+x+"</li>").join("");drawMap();save()}function drawMap(){map.innerHTML="";for(let y=0;y<9;y++)for(let x=0;x<9;x++){let c=mapRows[y][x],d=document.createElement("div");d.className="tile "+(c=="W"?"water":c=="R"?"road":c=="T"?"wall":c=="P"?"portal":"");if(x==s.x&&y==s.y){d.className+=" me";d.textContent="나"}else d.textContent=c=="W"?"~":c=="T"?"▲":c=="P"?"◎":"";map.appendChild(d)}}function flash(v){impact.textContent=v;impact.classList.remove("on");void impact.offsetWidth;impact.classList.add("on")}function attack(type){let cost={slash:0,fire:18,ice:12}[type]||0;if(s.mp<cost){log("MP 부족");return}s.mp-=cost;let dmg=s.atk+Math.floor(Math.random()*10)+(type=="fire"?18:type=="ice"?9:0);s.mhp-=dmg;flash(type=="fire"?"불":type=="ice"?"얼음":"공격");log(mobs[s.m][0]+"에게 "+dmg+" 피해");if(s.mhp<=0)win();else enemy();render()}function enemy(){let dmg=Math.max(1,mobs[s.m][3]-s.def+Math.floor(Math.random()*7));s.hp-=dmg;log("피격 "+dmg);if(s.hp<=0){s.hp=80;s.gold=Math.max(0,s.gold-10);log("쓰러졌지만 마을에서 부활")}}function heal(){if(s.mp<14){log("MP 부족");return}s.mp-=14;s.hp=Math.min(120,s.hp+38);flash("회복");log("HP 회복");render()}function guard(){if(s.mp<10){log("MP 부족");return}s.mp-=10;s.def+=1;flash("방어");log("방어력 +1");render()}function win(){let g=15+Math.floor(Math.random()*25);s.gold+=g;s.xp+=28;log(mobs[s.m][0]+" 처치, 골드 +"+g);if(Math.random()<.35)s.inv.push(["황금 상자","그림자 보석","마나 주문서","성스러운 문장"][Math.floor(Math.random()*4)]);if(s.xp>=100){s.xp-=100;s.lv++;s.atk+=3;s.def+=1;s.hp=120;s.mp=80;log("레벨업! Lv."+s.lv)}nextMob()}function nextMob(){s.m=(s.m+1)%mobs.length;s.mhp=mobs[s.m][2];render()}function move(dx,dy){let nx=s.x+dx,ny=s.y+dy;if(dx==0&&dy==0){log("주변을 살핍니다");return}let c=mapRows[ny]?.[nx];if(!c||c=="T"||c=="W"){log("이동 불가");return}s.x=nx;s.y=ny;if(c=="P"){log("포탈 진입");nextMob()}else if(Math.random()<.22){log("몬스터 조우");attack("slash")}render()}function resetGame(){localStorage.removeItem("ydh_run_now");location.reload()}document.addEventListener("keydown",e=>{if(e.key=="ArrowUp"||e.key=="w")move(0,-1);if(e.key=="ArrowDown"||e.key=="s")move(0,1);if(e.key=="ArrowLeft"||e.key=="a")move(-1,0);if(e.key=="ArrowRight"||e.key=="d")move(1,0)});render();log("게임 시작");
</script>
</body>
</html>
